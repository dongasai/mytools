syntax = "proto3";

package featureexceldemo.orderexcel;

option php_namespace = "Modules\\ApiProto\\Protobuf\\FeatureExcelDemo\\Orderexcel";
option go_package = "github.com/tanneng/nengtan_laravel/proto/feature_excel_demo/orderexcel";
option java_multiple_files = true;
option java_package = "com.tanneng.nengtan_laravel.proto.feature_excel_demo.orderexcel";

import "ApiProto/common.proto";

// ============================================================================
// 订单导入导出相关 API
// 演示导入/导出的三个基本api: 下载模板download-template/导入import/导出export
//  列表Api用于预览数据
// ============================================================================

// /api/proto/feature_excel_demo/order/import
message FeatureExcelDemoOrderImportRequest {
    string file_path = 1;  // 文件路径（上传后）
}

// /api/proto/feature_excel_demo/order/import
message FeatureExcelDemoOrderImportResponse {
    ApiProto.Common.BaseResponse base = 1;
    ImportResult data = 2;

    message ImportResult {
        int32 success_count = 1;
        int32 failed_count = 2;
        repeated string errors = 3;
    }
}

// /api/proto/feature_excel_demo/order/export
message FeatureExcelDemoOrderExportRequest {
    string status = 1;       // 状态过滤
    string date_from = 2;    // 开始日期
    string date_to = 3;      // 结束日期
}

// /api/proto/feature_excel_demo/order/export
message FeatureExcelDemoOrderExportResponse {
    ApiProto.Common.BaseResponse base = 1;
    ExportResult data = 2;

    message ExportResult {
        string file_url = 1;  // 文件下载URL
        int32 total = 2;      // 总记录数
    }
}

// /api/proto/feature_excel_demo/order/list
message FeatureExcelDemoOrderListRequest {
    string status = 1;
    string order_no = 2;
    string customer_name = 3;
    string date_from = 4;
    string date_to = 5;
    int32 page = 6;
    int32 page_size = 7;
}

// /api/proto/feature_excel_demo/order/list
message FeatureExcelDemoOrderListResponse {
    ApiProto.Common.BaseResponse base = 1;
    ListResult data = 2;

    message ListResult {
        repeated OrderItem list = 1;
        int32 total = 2;
        int32 page = 3;
        int32 page_size = 4;
    }

    message OrderItem {
        int32 id = 1;
        string order_no = 2;
        string customer_name = 3;
        string product_name = 4;
        int32 quantity = 5;
        double unit_price = 6;
        double total_amount = 7;
        string order_date = 8;
        string status = 9;
        string remark = 10;
        string created_at = 11;
    }
}

// /api/proto/feature_excel_demo/order/download_template
message FeatureExcelDemoOrderDownloadTemplateRequest {
    // 无需参数
}

// /api/proto/feature_excel_demo/order/download_template
message FeatureExcelDemoOrderDownloadTemplateResponse {
    ApiProto.Common.BaseResponse base = 1;
    TemplateResult data = 2;

    message TemplateResult {
        string file_url = 1;      // 文件下载URL
        string file_name = 2;     // 文件名
        int64 file_size = 3;      // 文件大小（字节）
        int32 field_count = 4;    // 字段数量
    }
}
