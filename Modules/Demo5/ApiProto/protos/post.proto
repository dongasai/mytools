syntax = "proto3";

package demo5.post;

option php_namespace = "Modules\\ApiProto\\Protobuf\\Demo5\\Post";
option go_package = "github.com/shandong-ziyou/dailian/proto/demo5/post";
option java_multiple_files = true;
option java_package = "com.shandong.ziyou.dailian.proto.demo5.post";

import "ApiProto/common.proto";

// ============================================================
// 文章 API Proto 定义
// 统一前缀: /api/proto/
// Handler路径: demo5/post
// 完整路径: /api/proto/demo5/post/{action}
// ============================================================

// ---- 创建文章 ----

// /api/proto/demo5/post/create
message Demo5PostCreateRequest {
    string title = 1;         // 文章标题，必填，长度 1-255 字符
    string content = 2;       // 文章内容，必填，支持富文本格式
    string status = 3;        // 文章状态: draft(草稿)、published(已发布)、archived(已归档)，默认 draft
    int32 user_id = 4;        // 作者用户ID，必填，关联用户表（可选，从token获取）
    int64 published_at = 5;   // 发布时间戳(Unix timestamp)，可选，默认为创建时间
}

// /api/proto/demo5/post/create
message Demo5PostCreateResponse {
    ApiProto.Common.BaseResponse base = 1;  // 统一基础响应
    PostData data = 2;        // 创建成功的文章完整数据
}

// ---- 获取文章详情 ----

// /api/proto/demo5/post/get
message Demo5PostGetRequest {
    int32 id = 1;             // 文章ID，必填，大于0
}

// /api/proto/demo5/post/get
message Demo5PostGetResponse {
    ApiProto.Common.BaseResponse base = 1;  // 统一基础响应
    PostData data = 2;        // 文章完整数据，包含标题、内容、状态等
}

// ---- 文章列表查询 ----

// /api/proto/demo5/post/list
message Demo5PostListRequest {
    int32 page = 1;           // 页码，默认 1，从 1 开始
    int32 page_size = 2;      // 每页条数，默认 20，范围 1-100
    string status = 3;        // 状态筛选: draft、published、archived，可选，为空表示全部
}

// /api/proto/demo5/post/list
message Demo5PostListResponse {
    ApiProto.Common.BaseResponse base = 1;  // 统一基础响应
    repeated PostData data = 2;  // 文章数据数组，包含所有匹配的文章
    ApiProto.Common.Pagination pagination = 3;  // 分页信息，包含当前页、每页条数、总数
}

// ---- 更新文章 ----

// /api/proto/demo5/post/update
message Demo5PostUpdateRequest {
    int32 id = 1;             // 文章ID，必填，大于0
    string title = 2;         // 新标题，可选，长度 1-255 字符
    string content = 3;       // 新内容，可选，支持富文本格式
    string status = 4;        // 新状态: draft、published、archived，可选
    int64 published_at = 5;   // 新发布时间戳(Unix timestamp)，可选
}

// /api/proto/demo5/post/update
message Demo5PostUpdateResponse {
    ApiProto.Common.BaseResponse base = 1;  // 统一基础响应
    PostData data = 2;        // 更新后的文章完整数据
}

// ---- 删除文章 ----

// /api/proto/demo5/post/delete
message Demo5PostDeleteRequest {
    int32 id = 1;             // 文章ID，必填，大于0
}

// /api/proto/demo5/post/delete
message Demo5PostDeleteResponse {
    ApiProto.Common.BaseResponse base = 1;  // 统一基础响应
}

// ---- 共享数据结构 ----

// 文章数据结构
// 用于返回文章的完整信息，包含所有字段
message PostData {
    int32 id = 1;             // 文章唯一ID，系统自动生成
    string title = 2;         // 文章标题
    string content = 3;       // 文章内容，支持富文本格式
    string status = 4;        // 文章状态: draft(草稿)、published(已发布)、archived(已归档)
    int32 user_id = 5;        // 作者用户ID，关联用户表
    int64 published_at = 6;   // 发布时间戳(Unix timestamp)，已发布文章的发布时间
    int64 created_at = 7;     // 创建时间戳(Unix timestamp)，系统自动生成
    int64 updated_at = 8;     // 最后更新时间戳(Unix timestamp)，系统自动维护
    int32 word_count = 9;     // 文章字数统计，系统自动计算
}