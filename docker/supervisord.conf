; Laravel 项目 Supervisord 配置
; 适用于基于 Apache + PHP 8.4 的容器环境
;
; 说明：
; - Apache 通过 Supervisor 管理，自动重启
; - 同时管理 Laravel 后台任务：队列处理和任务调度
; - 生产环境路径：/var/www/html

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:init-permissions]
; 初始化 Laravel 必需的目录权限（一次性任务）
command=bash -c "mkdir -p /var/www/html/storage/logs /var/www/html/storage/app/public /var/www/html/storage/framework/cache /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/bootstrap/cache && chown -R php:php /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache"
directory=/var/www/html
autostart=true
autorestart=false
startsecs=0
startretries=1
user=root
stdout_logfile=/var/log/supervisor/init-permissions.log
stderr_logfile=/var/log/supervisor/init-permissions.log

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/apache2.log
stderr_logfile=/var/log/supervisor/apache2.log

[program:queue-worker]
; Laravel 队列任务处理器
command=php artisan queue:work -v --sleep=3 --tries=3
directory=/var/www/html
autostart=true
autorestart=true
user=php
stdout_logfile=/var/www/html/storage/logs/queue-worker.log
stderr_logfile=/var/www/html/storage/logs/queue-worker.log
stopasgroup=true
killasgroup=true

[program:schedule-worker]
; Laravel 任务调度器
command=php artisan schedule:work -v
directory=/var/www/html
autostart=true
autorestart=true
user=php
stdout_logfile=/var/www/html/storage/logs/schedule-worker.log
stderr_logfile=/var/www/html/storage/logs/schedule-worker.log
stopasgroup=true
killasgroup=true