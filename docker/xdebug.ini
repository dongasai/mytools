; Xdebug configuration for Docker environment
; Note: Extension is loaded by docker-php-ext-enable, only configure parameters here

; General configuration
xdebug.mode=debug,develop
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.idekey=VSCODE

; Debug settings
xdebug.log=/var/log/xdebug.log
xdebug.log_level=0

; Performance settings
xdebug.max_nesting_level=256
xdebug.var_display_max_depth=10
xdebug.var_display_max_children=128
xdebug.var_display_max_data=512

; Develop mode features
xdebug.trigger_value=dev
xdebug.file_link_format=vscodium://file/%f:%l